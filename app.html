<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-RRTB0GM5SN"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-RRTB0GM5SN");
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/images/icon.png" />
    <link rel="canonical" href="https://cohalinkk.fr/app.html" />
    <meta
      name="description"
      content="Téléchargez l'application CohaLinkk - Réinvente la colocation pour tous"
    />
    <title>Télécharger CohaLinkk - App Store & Play Store</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .logo {
        width: 120px;
        height: 120px;
        margin: 0 auto 30px;
        border-radius: 25px;
        object-fit: contain;
      }

      h1 {
        color: #333;
        font-size: 28px;
        margin-bottom: 10px;
        font-weight: 700;
      }

      p {
        color: #666;
        font-size: 16px;
        margin-bottom: 30px;
        line-height: 1.6;
      }

      .loading {
        display: inline-block;
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px 0;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 30px;
      }

      .store-button {
        display: inline-block;
        padding: 15px 30px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        transition: transform 0.2s, box-shadow 0.2s;
        border: none;
        cursor: pointer;
      }

      .store-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      .app-store {
        background: #000;
        color: white;
      }

      .play-store {
        background: #01875f;
        color: white;
      }

      .fallback {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #eee;
      }

      .fallback-text {
        color: #999;
        font-size: 14px;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        src="./assets/images/logo_cohalinkk_bleu.png"
        alt="CohaLinkk"
        class="logo"
      />
      <h1>Télécharger CohaLinkk</h1>
      <p id="status">Détection de votre appareil...</p>
      <div id="loading" class="loading"></div>
      <div id="buttons" class="buttons" style="display: none"></div>
    </div>

    <script>
      // URLs des stores
      const APP_STORE_URL =
        "https://apps.apple.com/fr/app/cohalinkk/id6747823273?itscg=30200&itsct=apps_box_badge&mttnsubad=6747823273";
      const PLAY_STORE_URL =
        "https://play.google.com/store/apps/details?id=fr.cohalinkk.app&hl=fr";

      // Fonction de détection de l'appareil
      function detectDevice() {
        const userAgent =
          navigator.userAgent || navigator.vendor || window.opera;

        // Détection iOS (iPhone, iPad, iPod)
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
          return "ios";
        }

        // Détection Android
        if (/android/i.test(userAgent)) {
          return "android";
        }

        // Par défaut, on considère que c'est un desktop
        return "desktop";
      }

      // Fonction de redirection
      function redirectToStore() {
        const device = detectDevice();
        const statusEl = document.getElementById("status");
        const loadingEl = document.getElementById("loading");
        const buttonsEl = document.getElementById("buttons");

        // Masquer le loading
        loadingEl.style.display = "none";

        if (device === "ios") {
          // Redirection vers App Store
          statusEl.textContent = "Redirection vers l'App Store...";
          window.location.href = APP_STORE_URL;
        } else if (device === "android") {
          // Redirection vers Play Store
          statusEl.textContent = "Redirection vers le Play Store...";
          window.location.href = PLAY_STORE_URL;
        } else {
          // Desktop : afficher les deux boutons
          statusEl.textContent =
            "Choisissez votre plateforme pour télécharger l'application";
          buttonsEl.style.display = "flex";
          buttonsEl.innerHTML = `
            <a href="${APP_STORE_URL}" target="_blank" class="store-button app-store">
              📱 Télécharger sur l'App Store
            </a>
            <a href="${PLAY_STORE_URL}" target="_blank" class="store-button play-store">
              🤖 Télécharger sur le Play Store
            </a>
          `;
        }
      }

      // Délai pour améliorer l'expérience utilisateur (optionnel)
      // On peut aussi rediriger immédiatement
      setTimeout(redirectToStore, 500);

      // Fallback : si la redirection automatique échoue, afficher les boutons après 3 secondes
      setTimeout(() => {
        const loadingEl = document.getElementById("loading");
        const buttonsEl = document.getElementById("buttons");
        const statusEl = document.getElementById("status");

        if (loadingEl.style.display !== "none") {
          loadingEl.style.display = "none";
          statusEl.textContent =
            "Choisissez votre plateforme pour télécharger l'application";
          buttonsEl.style.display = "flex";
          buttonsEl.innerHTML = `
            <a href="${APP_STORE_URL}" target="_blank" class="store-button app-store">
              📱 Télécharger sur l'App Store
            </a>
            <a href="${PLAY_STORE_URL}" target="_blank" class="store-button play-store">
              🤖 Télécharger sur le Play Store
            </a>
          `;
        }
      }, 3000);
    </script>
  </body>
</html>
