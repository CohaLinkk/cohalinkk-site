# /etc/nginx/sites-available/cohalinkk
# Certbot ajoutera ensuite automatiquement le HTTPS (certbot --nginx).

limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;

# Domaines secondaires -> domaine principal
server {
    listen 80;
    listen [::]:80;
    server_name www.cohalinkk.fr cohalinkk.com www.cohalinkk.com;
    return 301 https://cohalinkk.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cohalinkk.fr;

    root /var/www/cohalinkk;
    index index.html;

    # Sécurité
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/javascript image/svg+xml;

    # Fichiers du dépôt qui ne doivent pas être publics
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }
    location ^~ /netlify/ { deny all; }
    location ~ ^/(README\.md|CNAME|DNS)$ { deny all; }

    # Formulaire de contact -> serveur Node local
    location = /api/contact {
        limit_req zone=contact burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 100k;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Anciennes URLs en .html -> URLs propres
    location ~ ^/(colocataire|proprietaire|politique-confidentialite)\.html$ {
        return 301 /$1;
    }

    # Cache long pour les ressources statiques
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 1y;
        access_log off;
    }

    # /colocataire -> colocataire.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
